<svg width="900" height="360" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="360" fill="#f8fafc"/>
  <text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">n8n Workflow Automation Layer</text>

  <rect x="50" y="95" width="190" height="90" rx="16" fill="#fee2e2" stroke="#e11d48"/>
  <text x="78" y="130" font-size="16" font-weight="700" fill="#991b1b">Trigger Files</text>
  <text x="78" y="155" font-size="13" fill="#334155">drift, retraining, inventory</text>

  <rect x="310" y="95" width="190" height="90" rx="16" fill="#fef3c7" stroke="#d97706"/>
  <text x="338" y="130" font-size="16" font-weight="700" fill="#92400e">Workflow Rules</text>
  <text x="338" y="155" font-size="13" fill="#334155">thresholds + routing</text>

  <rect x="570" y="95" width="270" height="90" rx="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="600" y="130" font-size="16" font-weight="700" fill="#166534">Human-in-the-loop Action</text>
  <text x="600" y="155" font-size="13" fill="#334155">alerts, approvals, tickets, reports</text>

  <line x1="240" y1="140" x2="310" y2="140" stroke="#334155" stroke-width="3"/>
  <line x1="500" y1="140" x2="570" y2="140" stroke="#334155" stroke-width="3"/>

  <text x="70" y="255" font-size="17" fill="#0f172a">Correct role: operationalize decision outputs after the analytics pipeline runs.</text>
  <text x="70" y="290" font-size="15" fill="#475569">Boundary: n8n does not replace Fabric, MLflow, the ML pipeline, or enterprise governance.</text>
</svg>
