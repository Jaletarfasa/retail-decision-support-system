<svg width="900" height="360" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="360" fill="#f8fbff"/>
  <text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">Retail Decision Support Architecture</text>

  <rect x="40" y="90" width="220" height="110" rx="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="70" y="130" font-size="18" font-weight="700" fill="#1e3a8a">MS Fabric-ready</text>
  <text x="70" y="160" font-size="15" fill="#1e3a8a">Trust Layer</text>
  <text x="70" y="185" font-size="13" fill="#334155">Quality gates, metadata, auditability</text>

  <line x1="260" y1="145" x2="340" y2="145" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="90" width="220" height="110" rx="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="370" y="130" font-size="18" font-weight="700" fill="#166534">Retail ML Engine</text>
  <text x="370" y="160" font-size="15" fill="#166534">Forecasts + Decisions</text>
  <text x="370" y="185" font-size="13" fill="#334155">Model comparison, inventory, drift</text>

  <line x1="560" y1="145" x2="640" y2="145" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="90" width="220" height="110" rx="18" fill="#fef3c7" stroke="#d97706"/>
  <text x="670" y="130" font-size="18" font-weight="700" fill="#92400e">n8n Workflow</text>
  <text x="670" y="160" font-size="15" fill="#92400e">Action Layer</text>
  <text x="670" y="185" font-size="13" fill="#334155">Alerts, approvals, reports</text>

  <text x="80" y="275" font-size="17" fill="#0f172a">Core story: trusted data → analytics/ML decisions → workflow action.</text>
  <text x="80" y="305" font-size="15" fill="#475569">Boundary: this visual explains the architecture; it does not prove live Fabric or n8n deployment.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
